
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Coupling</title>

    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/dashboard.js" defer></script>
</head>

<body>

    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="/" class="logo">Coupling</a>

            <button id="logoutButton" class="btn btn-small">
                Log Out
            </button>
        </nav>
    </header>

    <main class="dashboard-container">

        <h1>My Dashboard</h1>
        <p id="welcomeMessage">Loading your account...</p>

        <div class="dashboard-layout">

            <div class="dashboard-editor">

                <!-- Profile editor -->
                <section class="dashboard-card">
                    <h2>Edit Profile</h2>

                    <form id="profileForm" novalidate>

                        <div class="form-group">
                            <label for="displayName">Display Name</label>
                            <input id="displayName" name="displayName" type="text" maxlength="50" required>
                        </div>

                        <div class="form-group">
                            <label for="bio">Biography</label>
                            <textarea id="bio" name="bio" rows="4" maxlength="300" placeholder="Tell people about yourself..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="themeSelect">Page Theme</label>

                            <select id="themeSelect" name="theme" class="theme-select">
                                <option value="lavender">Lavender</option>
                                <option value="midnight">Midnight</option>
                                <option value="forest">Forest</option>
                            </select>
                        </div>

                        <button type="submit" class="btn">
                            Save Profile
                        </button>

                    </form>
                </section>

                <!-- Link editor -->
                <section class="dashboard-card">
                    <h2 id="linkFormHeading">Add a Link</h2>

                    <form id="linkForm" novalidate>

                        <div class="form-group">
                            <label for="linkTitle">Link Title</label>
                            <input id="linkTitle" name="linkTitle" type="text" maxlength="60" placeholder="Example: GitHub" required>
                        </div>

                        <div class="form-group">
                            <label for="linkUrl">URL</label>
                            <input id="linkUrl" name="linkUrl" type="url" placeholder="https://github.com/username" required>
                        </div>

                        <button id="saveLinkButton" type="submit" class="btn">
                            Add Link
                        </button>

                        <button id="cancelEditButton" type="button" class="btn btn-secondary" hidden>
                            Cancel Edit
                        </button>

                    </form>
                </section>

                <!-- Saved links -->
                <section class="dashboard-card">
                    <h2>My Links</h2>

                    <div id="linksContainer">
                        <p>Loading your links...</p>
                    </div>
                </section>

            </div>

            <aside class="dashboard-preview">

                <!-- Live profile preview -->
                <section class="dashboard-card">

                    <h2>Live Page Preview</h2>

                    <div class="preview-wrapper">

                        <div id="livePreviewCard" class="live-preview-card theme-surface" data-theme="lavender">

                            <div id="previewAvatar" class="avatar">
                                ?
                            </div>

                            <h3 id="previewName">Your Name</h3>

                            <p id="previewBio">Your biography</p>

                            <div id="previewLinks" class="public-links">
                            </div>

                        </div>

                    </div>
                    
                    <div class="preview-actions">

                        <a id="publicPageLink"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn"
                        hidden>
                            View Published Page
                        </a>

                        <button id="copyPageLink"
                                type="button"
                                class="btn btn-secondary"
                                disabled>
                            Copy Page URL
                        </button>

                    </div>

                </section>

            </aside>

        </div>

        <p id="dashboardMessage" class="form-message" role="status" aria-live="polite"></p>

    </main>

</body>
</html>
