
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Public Profile | LinkSpace</title>

    <link rel="stylesheet" href="/css/styles.css">

    <script src="/js/profile.js" defer></script>
</head>

<body class="public-profile-body">

    <header class="public-header">
        <a href="/" class="logo">LinkSpace</a>
    </header>

    <main class="public-profile-container">

        <section id="publicProfileCard" class="public-profile-card theme-surface" data-theme="lavender">

            <div id="publicAvatar" class="avatar">
                ?
            </div>

            <h1 id="publicName">Loading...</h1>

            <p id="publicBio"></p>

            <div id="publicLinks"
                 class="public-links">
            </div>

            <p id="publicMessage"
               class="form-message"
               role="status"
               aria-live="polite"></p>

        </section>

    </main>

    <footer class="site-footer">
        <p>Made with LinkSpace</p>
    </footer>

</body>
</html>
