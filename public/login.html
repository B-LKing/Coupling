
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Coupling</title>

    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/auth.js" defer></script>
</head>

<body>

    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="/" class="logo">Coupling</a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/register.html">Register</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">

            <h1>Welcome Back</h1>
            <p>Log in to manage your link page.</p>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="loginEmail">Email</label>

                    <input type="email" id="loginEmail" name="email" required autocomplete="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="Enter your password">
                </div>

                <p id="loginError" class="form-message" role="status" aria-live="polite"></p>
                <button type="submit" class="btn auth-btn"> Log In </button>

            </form>

            <p class="auth-footer"> Don't have an account? <a href="/register.html">Register</a> </p>

        </section>
    </main>

</body>
</html>
